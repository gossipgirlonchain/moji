# Builds the iOS shell (ios/) on a macOS runner: a simulator build and an unsigned device build,
# both uploaded as artifacts. No Apple credentials needed. Signing for TestFlight is a follow-up
# (see README "iOS app").
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet build
          ditto -c -k --keepParent build/sim/Build/Products/Debug-iphonesimulator/App.app build/moji-simulator.app.zip

      - name: Build for device, unsigned (Release)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
          mkdir -p build/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app build/Payload/
          (cd build && ditto -c -k --keepParent Payload moji-unsigned.ipa)

      - uses: actions/upload-artifact@v4
        with:
          name: moji-ios-simulator
          path: build/moji-simulator.app.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: moji-ios-unsigned-ipa
          path: build/moji-unsigned.ipa
          if-no-files-found: error
